<div class="page">
    <mat-card class="employee-card">
        <div class="header">
            <h2>
                <mat-icon>person</mat-icon>
                {{ employeeId ? 'Edit Employee' : 'Add Employee' }}
            </h2>
        </div>
        @if(form){
        <form [formGroup]="form" (ngSubmit)="save()">
            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name">

                    <mat-error *ngIf="form.get('name')?.hasError('required')">
                        Name is required
                    </mat-error>
                </mat-form-field>
            </div>

            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email">

                    <mat-error *ngIf="form.get('email')?.hasError('required')">
                        Email is required
                    </mat-error>

                    <mat-error *ngIf="form.get('email')?.hasError('email')">
                        Enter a valid email
                    </mat-error>
                </mat-form-field>
            </div>

            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>Salary</mat-label>
                    <input matInput type="number" formControlName="salary">

                    <mat-error *ngIf="form.get('salary')?.hasError('required')">
                        Salary is required
                    </mat-error>

                    <mat-error *ngIf="form.get('salary')?.hasError('min')">
                        Salary must be greater than zero
                    </mat-error>
                </mat-form-field>
            </div>

            <div class="buttons">
                <button type="button" mat-stroked-button (click)="cancel()">
                    Cancel
                </button>

                <button type="submit" mat-flat-button color="primary" [disabled]="loading">
                    {{ employeeId ? 'Update' : 'Save' }}
                </button>
            </div>
        </form>
        }
    </mat-card>
</div>
